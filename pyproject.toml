[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clayquant"
version = "0.1.0"
description = "Simulation of X-ray powder diffraction patterns of mica/illite and interstratified clay minerals, and quantification of clay mineral assemblages from oriented-mount measurements"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lorraine Malaspina" }]
keywords = ["XRD", "clay minerals", "illite", "smectite", "interstratification", "Rietveld", "NNLS"]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
gui = ["dash>=2.14", "plotly>=5.18"]
plot = ["matplotlib>=3.7"]
# gemmi expands space group symbols when importing a TOPAS structure library.
# It is needed for that import only: the generated database stores the symmetry
# operations explicitly and is read without it.
import = ["gemmi>=0.6"]
# pyflakes is used by tests/test_no_undefined_names.py, which checks the whole
# source for names that do not exist - the failure mode that only shows itself
# when a particular button is pressed.
dev = ["pytest>=7.4", "pyflakes>=3.0"]

[project.scripts]
clayquant-build-library = "clayquant.library:main"
clayquant-import-structures = "clayquant.bern:main"
clayquant-gui = "clayquant.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clayquant = ["data/*.json"]

[tool.pytest.ini_options]
markers = ["slow: needs a grid search over calculated patterns"]
testpaths = ["tests"]
